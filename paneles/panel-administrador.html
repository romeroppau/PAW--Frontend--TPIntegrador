<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel de administración de HuellaVet.">
  <title>Panel de administrador | HuellaVet</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/barra-rol.css">
  <link rel="stylesheet" href="/css/paneles.css">
</head>

<!-- data-rol: rol que puede ver esta página (lo lee js/guardia-panel.js) -->
<body data-rol="VETERINARIO">
  <header class="panel-cabecera">
    <div class="contenedor"><a class="panel-marca" href="/index.html">HuellaVet</a>
      <p class="panel-usuario">Panel de administrador</p>
      <!-- js/auth.js cambia esta cabecera por la del rol, con su barra de menús (js/barra-rol.js) -->
      <div class="sesion" id="sesion"></div>
    </div>
  </header>
  <!-- hidden: se muestra recién cuando guardia-panel.js confirma el rol -->
  <main class="panel-principal" hidden>
    <section class="panel-intro">
      <div>
        <p class="etiqueta">Gestión del sistema</p>
        <h1>Panel de administrador</h1>
        <p>Accesos generales para administrar turnos, pacientes, productos, inventario y adopciones.</p>
        <p class="panel-pista"><span aria-hidden="true">↑</span> Elegí una sección en el menú de arriba para ver sus opciones.</p>
      </div>
      <div class="panel-intro-huella"><svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"><g fill="currentColor"><ellipse cx="14" cy="27" rx="7" ry="9"/><ellipse cx="29" cy="15" rx="7" ry="10"/><ellipse cx="45" cy="15" rx="7" ry="10"/><ellipse cx="57" cy="29" rx="6" ry="9"/><path d="M32 31c-9 0-18 9-18 17 0 6 5 9 11 8 3-.6 5-1.5 7-1.5s4 .9 7 1.5c6 1 11-2 11-8 0-8-9-17-18-17z"/></g></svg></div>
    </section>
  </main>
  <footer class="panel-pie">
    <p>HuellaVet · Administración</p>
  </footer>

  <script type="module" src="/js/guardia-panel.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>

</html>
