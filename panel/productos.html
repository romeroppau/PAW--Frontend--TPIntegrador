<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Productos — HuellaVet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body data-pagina="listado">
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <div id="encabezado-sitio"></div>
  <script src="/js/layout.js"></script>
  <main id="contenido" class="seccion" hidden>
    <div class="contenedor">
      <p><a href="/paneles/panel-administrador.html">&larr; Volver al panel de administrador</a></p>
      <div class="barra-titulo">
        <h1>Productos</h1>
        <a class="boton" href="/panel/producto-form.html">Nuevo producto</a>
      </div>
      <p class="estado" id="estado" role="status"></p>
      <div class="tabla-scroll">
        <table>
          <caption class="solo-lectores">Listado de productos</caption>
          <thead><tr><th scope="col">Nombre</th><th scope="col">Categoría</th><th scope="col">Precio</th><th scope="col">Stock</th><th scope="col">Vencimiento</th><th scope="col">Estado</th><th scope="col">Acciones</th></tr></thead>
          <tbody id="filas"></tbody>
        </table>
      </div>
    </div>
  </main>
  <div id="pie-sitio"></div>
  <script type="module" src="/js/panel.js"></script>
</body>
</html>
