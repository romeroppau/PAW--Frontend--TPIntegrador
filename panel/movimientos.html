<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Movimientos — HuellaVet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body data-pagina="movimientos">
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <div id="encabezado-sitio"></div>
  <script src="/js/layout.js"></script>
  <main id="contenido" class="seccion" hidden>
    <div class="contenedor">
      <div class="barra-titulo">
        <h1>Movimientos de inventario</h1>
        <a class="boton boton-borde" href="/panel/productos.html">Volver al listado</a>
      </div>
      <p class="estado" id="estado" role="status"></p>
      <div class="tabla-scroll">
        <table>
          <caption class="solo-lectores">Historial de movimientos del producto</caption>
          <thead><tr><th scope="col">Fecha</th><th scope="col">Tipo</th><th scope="col">Cantidad</th></tr></thead>
          <tbody id="filas"></tbody>
        </table>
      </div>
    </div>
  </main>
  <div id="pie-sitio"></div>
  <script type="module" src="/js/panel.js"></script>
</body>
</html>
