<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel · Producto — HuellaVet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body data-pagina="formulario">
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <div id="encabezado-sitio"></div>
  <script src="/js/layout.js"></script>
  <main id="contenido" class="seccion" hidden>
    <div class="contenedor contenedor-form">
      <h1 id="titulo">Nuevo producto</h1>
      <p class="estado" id="estado" role="status"></p>
      <form id="form-producto" novalidate>
      <div class="campo">
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" aria-describedby="error-nombre" required>
        <span class="campo-error" id="error-nombre"></span>
      </div>
      <div class="campo">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" rows="3" aria-describedby="error-descripcion"></textarea>
        <span class="campo-error" id="error-descripcion"></span>
      </div>
      <div class="campo">
        <label for="categoria">Categoría</label>
        <select id="categoria" name="categoria" aria-describedby="error-categoria" required>
          <option value="">Elegí una categoría</option>
          <option value="MEDICAMENTO">Medicamentos</option>
          <option value="ALIMENTO">Alimento balanceado</option>
          <option value="ACCESORIO">Accesorios</option>
        </select>
        <span class="campo-error" id="error-categoria"></span>
      </div>
      <div class="campo">
        <label for="especie">Especie</label>
        <select id="especie" name="especie" aria-describedby="error-especie" required>
          <option value="">Elegí una especie</option>
          <option value="PERRO">Perro</option>
          <option value="GATO">Gato</option>
          <option value="TODAS">Todas las especies</option>
        </select>
        <span class="campo-error" id="error-especie"></span>
      </div>
      <div class="campo">
        <label for="precio">Precio</label>
        <input id="precio" name="precio" type="number" aria-describedby="error-precio" min="0" step="0.01" required>
        <span class="campo-error" id="error-precio"></span>
      </div>
      <div class="campo">
        <label for="stock">Stock inicial</label>
        <input id="stock" name="stock" type="number" aria-describedby="error-stock" min="0" step="1" required>
        <span class="campo-error" id="error-stock"></span>
      </div>
      <div class="campo">
        <label for="vencimiento">Vencimiento</label>
        <input id="vencimiento" name="vencimiento" type="date" aria-describedby="error-vencimiento">
        <span class="campo-error" id="error-vencimiento"></span>
      </div>
      <div class="campo">
        <label for="imagen">Imagen (máximo 1 MB)</label>
        <input id="imagen" name="imagen" type="file" aria-describedby="error-imagen" accept="image/*">
        <span class="campo-error" id="error-imagen"></span>
      </div>
      <p class="mensaje mensaje-error" id="error-general" role="alert" hidden></p>
        <button class="boton" type="submit">Guardar</button>
        <a class="boton boton-borde" href="/panel/productos.html">Cancelar</a>
      </form>
    </div>
  </main>
  <div id="pie-sitio"></div>
  <script type="module" src="/js/panel.js"></script>
</body>
</html>
