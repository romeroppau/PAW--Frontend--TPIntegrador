<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Detalle de un producto del catálogo de HuellaVet.">
  <title>Detalle del producto | HuellaVet</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/catalogo/catalogo.css">
  <script type="module" src="/js/producto.js"></script>
</head>

<body>
  <header class="catalogo-header">
    <div class="contenedor encabezado-catalogo">
      <a class="marca-catalogo" href="/index.html">HuellaVet</a>
      <nav aria-label="Navegación principal">
        <a href="/index.html">Inicio</a>
        <a href="/catalogo/catalogo.html" aria-current="page">Tienda</a>
        <a href="/login/login.html">Ingresar</a>
      </nav>
    </div>
  </header>

  <main class="contenedor detalle-principal">
    <p class="volver-catalogo"><a href="/catalogo/catalogo.html">← Volver al catálogo</a></p>
    <p id="estado-detalle" class="estado" role="status" aria-live="polite">Cargando producto…</p>
    <article id="detalle-producto" class="detalle-producto" hidden>
      <div class="detalle-imagen-wrap">
        <img id="producto-imagen" class="detalle-imagen" alt="" hidden>
        <div id="producto-sin-imagen" class="imagen-provisoria detalle-sin-imagen" aria-hidden="true">Imagen del
          producto</div>
      </div>
      <div class="detalle-contenido">
        <p id="producto-categoria" class="etiqueta"></p>
        <h1 id="producto-nombre"></h1>
        <p id="producto-especie" class="detalle-especie"></p>
        <p id="producto-precio" class="precio detalle-precio"></p>
        <p id="producto-descripcion" class="detalle-descripcion"></p>
        <a id="producto-whatsapp" class="boton boton-acento"
          href="https://wa.me/?text=Hola%2C%20quiero%20consultar%20por%20un%20producto%20de%20HuellaVet" target="_blank"
          rel="noopener noreferrer">Consultar por WhatsApp</a>
      </div>
    </article>
    <p id="error-detalle" class="mensaje mensaje-error" hidden></p>
  </main>

  <footer class="pie pie-catalogo">
    <div class="contenedor">
      <section>
        <h2>HuellaVet</h2>
        <p>Productos para acompañar el cuidado y bienestar animal.</p>
      </section>
    </div>
  </footer>
</body>

</html>
