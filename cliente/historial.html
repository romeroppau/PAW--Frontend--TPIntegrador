<!-- PANTALLA VACÍA (Entrega 4). La completa el rol 4 (Cristian).
     Para completarla: reemplazar el contenido de <main> y agregar el script propio (js/historial.js).
     Mantener estas dos cosas:
       - data-rol del <body>: roles que pueden ver la página (separados por coma si son varios).
       - los scripts menu.js, guardia-panel.js y auth.js: el <main> queda oculto (hidden) hasta que
         guardia-panel.js confirma el rol, y el menú y el botón "Salir" los arma auth.js. -->
<body data-rol="CLIENTE,VETERINARIO">
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <div id="encabezado-sitio"></div>
  <script src="/js/layout.js"></script>
  <main id="contenido" class="seccion" hidden>
    <div class="contenedor">
      <p><a href="/index.html">&larr; Volver al inicio</a></p>
      <h1>Historial clínico</h1>
      <p class="mensaje">Pantalla en construcción: la completa el rol 4 (Cristian) en la Entrega 4.</p>
    </div>
  </main>
  <div id="pie-sitio"></div>

  <script type="module" src="/js/menu.js"></script>
  <script type="module" src="/js/guardia-panel.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
