<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendario sanitario | HuellaVet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/base.css">
</head>
<!-- Calendario sanitario de una mascota (Entrega 4, rol 3).
     Mantener:
       - data-rol del <body>: roles que pueden ver la página.
       - los scripts menu.js, guardia-panel.js y auth.js: el <main> queda oculto (hidden) hasta que
         guardia-panel.js confirma el rol, y el menú y el botón "Salir" los arma auth.js.
     Se abre con ?mascota=<id>. Sin ese parámetro, se elige la mascota de una lista (el cliente ve
     las suyas; el veterinario, todas). -->
<body data-rol="CLIENTE,VETERINARIO">
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <div id="encabezado-sitio"></div>
  <script src="/js/layout.js"></script>
  <main id="contenido" class="seccion" hidden>
    <div class="contenedor">
      <p><a href="/index.html" data-volver-panel>&larr; Volver a mi panel</a></p>
      <h1>Calendario sanitario</h1>
      <p>Vacunas y desparasitaciones de cada mascota, según su especie y su edad.</p>

      <!-- Solo la veterinaria (Entrega 5): busca por el nombre de la mascota o del dueño y la lista se
           achica a las que coinciden. js/calendario.js lo muestra según el rol. -->
      <div class="campo campo-buscar" id="campo-buscar" hidden>
        <label for="buscar">Buscar por mascota o dueño</label>
        <input id="buscar" type="search" autocomplete="off" maxlength="80" placeholder="Ej.: Luna o Pérez">
      </div>
      <form id="form-mascota" class="campo campo-selector" novalidate>
        <label for="mascota">Mascota</label>
        <select id="mascota" name="mascota">
          <option value="">Elegí una mascota</option>
        </select>
      </form>

      <p class="estado" id="estado" role="status"></p>

      <section id="calendario" class="bloque" aria-labelledby="titulo-mascota" hidden>
        <div class="barra-titulo">
          <h2 id="titulo-mascota"></h2>
          <a id="enlace-historial" href="/cliente/historial.html">Ver historial clínico</a>
        </div>
        <p id="duenio" hidden>Dueño: <span id="duenio-enlace"></span></p>
        <p id="al-dia" class="mensaje"></p>
        <!-- El calendario no se arma solo (25/11): hasta que la veterinaria lo carga, está vacío. El texto
             lo pone js/calendario.js según quién lo mira. -->
        <p class="mensaje" id="vacio" hidden></p>
        <!-- Solo la veterinaria (25/11): agrega al calendario una vacuna o desparasitación del plan de la
             especie. Sin estar en el calendario no se puede sacar un turno para darla. -->
        <form id="form-agregar" class="form-item" novalidate hidden>
          <h3 class="ancho-completo">Agregar al calendario</h3>
          <div class="campo">
            <label for="plan_sanitario_id">Vacuna o desparasitación</label>
            <select id="plan_sanitario_id" name="plan_sanitario_id"></select>
            <span class="campo-error" id="error-plan_sanitario_id"></span>
          </div>
          <div class="campo">
            <label for="fecha_programada">Le toca el</label>
            <input id="fecha_programada" name="fecha_programada" type="date" required aria-describedby="ayuda-fecha_programada">
            <!-- Desde cuándo se puede dar según la dosis anterior (días mínimos de Configuración → Vacunas). -->
            <span class="campo-ayuda" id="ayuda-fecha_programada"></span>
            <span class="campo-error" id="error-fecha_programada"></span>
          </div>
          <p class="campo-error" id="error-general" role="alert" hidden></p>
          <button type="submit" class="boton" id="agregar">Agregar</button>
        </form>
        <div class="tabla-scroll" id="tabla">
          <table>
            <caption class="solo-lectores" id="leyenda-tabla">Calendario sanitario</caption>
            <thead><tr><th scope="col">Fecha</th><th scope="col">Tipo</th><th scope="col">Vacuna o desparasitación</th><th scope="col">Estado</th><th scope="col" id="col-acciones" hidden>Acciones</th></tr></thead>
            <tbody id="filas"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <div id="pie-sitio"></div>

  <script type="module" src="/js/menu.js"></script>
  <script type="module" src="/js/guardia-panel.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/calendario.js"></script>
</body>
</html>
