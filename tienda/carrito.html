<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi carrito | HuellaVet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/tienda.css">
</head>
<!-- Carrito del comprador (cliente o rescatista). Lo maneja js/carrito.js.
     Contrato: repo Inventario, docs/api/contrato-tienda.md.
     "Ir a pagar" confirma la compra (aparta el stock por 15 minutos): solo se habilita después de
     marcar que leyó la política de cancelación. -->
<body data-rol="CLIENTE,RESCATISTA">
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <div id="encabezado-sitio"></div>
  <script src="/js/layout.js"></script>
  <main id="contenido" class="seccion" hidden>
    <div class="contenedor">
      <p><a href="/catalogo/catalogo.html">&larr; Seguir comprando</a></p>
      <h1>Mi carrito</h1>
      <p class="estado" id="estado" role="status">Cargando tu carrito…</p>
      <p class="mensaje mensaje-error" id="error" role="alert" hidden></p>

      <div id="vacio" hidden>
        <p>Tu carrito está vacío.</p>
        <p><a class="boton" href="/catalogo/catalogo.html">Ver productos</a></p>
      </div>

      <div id="contenido-carrito" hidden>
        <div class="tabla-scroll">
          <table class="tabla-carrito">
            <caption class="solo-lectores">Productos de tu carrito</caption>
            <thead><tr><th scope="col">Producto</th><th scope="col">Precio</th><th scope="col">Cantidad</th><th scope="col">Subtotal</th><th scope="col"><span class="solo-lectores">Quitar</span></th></tr></thead>
            <tbody id="filas"></tbody>
            <tfoot><tr><th scope="row" colspan="3">Total</th><td id="total" class="total"></td><td></td></tr></tfoot>
          </table>
        </div>

        <section class="bloque caja-pago" aria-labelledby="titulo-politica">
          <h2 id="titulo-politica">Política de cancelación</h2>
          <p id="politica"></p>
          <p class="ayuda">Al tocar "Ir a pagar" reservamos tus productos por 15 minutos para que hagas el pago.</p>
          <div class="casilla">
            <input id="acepto" type="checkbox">
            <label for="acepto">Leí y acepto la política de cancelación</label>
          </div>
          <p class="campo-error" id="motivo-bloqueo" hidden></p>
          <button id="ir-a-pagar" class="boton boton-grande" type="button" disabled>Ir a pagar</button>
        </section>
      </div>
    </div>
  </main>
  <div id="pie-sitio"></div>

  <script type="module" src="/js/menu.js"></script>
  <script type="module" src="/js/guardia-panel.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/carrito.js"></script>
</body>
</html>
