<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis compras | HuellaVet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/tienda.css">
</head>
<!-- Las compras del comprador (cliente o rescatista), de la más nueva a la más vieja: por defecto las
     de los últimos 30 días, con un filtro Desde / Hasta, de a 20 ("Ver más"). La factura se ve
     desde el detalle de cada compra (24/11: ya no hay columna "Factura"). Lo maneja js/compras.js con GET /api/tienda/compras?desde=&hasta=&pagina=
     (repo Inventario, docs/api/contrato-tienda.md). -->
<body data-rol="CLIENTE,RESCATISTA">
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <div id="encabezado-sitio"></div>
  <script src="/js/layout.js"></script>
  <main id="contenido" class="seccion" hidden>
    <div class="contenedor">
      <h1>Mis compras</h1>
      <p>Los pedidos se retiran en el local de HuellaVet.</p>

      <form id="filtro" class="filtro-fechas" novalidate>
        <div class="campo">
          <label for="desde">Desde</label>
          <input id="desde" name="desde" type="date">
        </div>
        <div class="campo">
          <label for="hasta">Hasta</label>
          <input id="hasta" name="hasta" type="date">
        </div>
        <button class="boton" type="submit">Filtrar</button>
        <button class="boton boton-borde" type="button" id="ultimos-30">Últimos 30 días</button>
      </form>

      <p class="estado" id="estado" role="status">Cargando tus compras…</p>

      <div id="vacio" hidden>
        <p id="texto-vacio">No hiciste compras en los últimos 30 días.</p>
        <p><a class="boton" href="/catalogo/catalogo.html">Ver productos</a></p>
      </div>

      <div class="tabla-scroll" id="tabla" hidden>
        <table>
          <caption class="solo-lectores">Tus compras</caption>
          <thead><tr><th scope="col">Compra</th><th scope="col">Fecha</th><th scope="col">Total</th><th scope="col">Estado</th><th scope="col">Para tener en cuenta</th></tr></thead>
          <tbody id="filas"></tbody>
        </table>
      </div>
      <p><button class="boton boton-borde" type="button" id="ver-mas" hidden>Ver más</button></p>
    </div>
  </main>
  <div id="pie-sitio"></div>

  <script type="module" src="/js/menu.js"></script>
  <script type="module" src="/js/guardia-panel.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/compras.js"></script>
</body>
</html>
